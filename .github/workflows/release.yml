name: CD

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC to npm — trusted publishing, no token secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # trusted publishing (OIDC) needs a recent npm CLI
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")" || { echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version"; exit 1; }
      - run: npm publish --access public
