<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>herdgate</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head">
        <span class="brand">herd<b>gate</b></span>
        <button id="btn-new" title="New terminal (runs this machine's default shell)">+ New</button>
      </div>
      <ul id="term-list">
        <li class="empty">(no terminals yet)</li>
      </ul>
      <div id="conn-state" class="side-foot">connecting…</div>
    </aside>
    <main id="main">
      <header id="topbar">
        <span id="term-title">(not attached)</span>
        <span class="grow"></span>
        <button id="btn-kill" class="danger" title="End the program in the current terminal (terminal.kill)">kill</button>
      </header>
      <div id="term-container"></div>
    </main>
  </div>
  <script type="importmap">
    {
      "imports": {
        "ghostty-web": "/vendor/ghostty-web.js",
        "herdview": "/vendor/herdview.js"
      }
    }
  </script>
  <script>window.__TOKEN__ = "__HERDR_WEB_TOKEN__";</script>
  <script type="importmap">
    {
      "imports": {
        "ghostty-web": "/vendor/ghostty-web.js",
        "/herdview/index.js": "/json-lines.js"
      }
    }
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
